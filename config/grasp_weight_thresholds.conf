# 左臂抓取后的力/重量判定统一配置。
#
# 使用位置：
# 1. Module 1读取本文件作为重量门控默认值。
# 2. Module 3不重复读取本文件；它验证 Module 1写入 handoff的实际分类，
#    保证同一轮任务使用完全一致的判定结果。
#
# 单位：重量为 g，MAD 为 N，时间为 s。

# 抓空：估计重量小于或等于该值。
WEIGHT_EMPTY_MAX_G=50.0

# 单件：本项目启用连续单件区间，因此 50 g 到 130 g 之间的稳定结果都视为 SINGLE。
# 这两个极小间隔用于避免边界值同时落入相邻类别。
WEIGHT_SINGLE_MIN_G=50.000000001
WEIGHT_SINGLE_MAX_G=129.999999999

# 多件：估计重量大于或等于该值。
WEIGHT_MULTIPLE_MIN_G=130.0

# 任一力轴在一个采样窗口内的 MAD 超过该值时，结果为 UNKNOWN。
WEIGHT_MAX_AXIS_MAD_N=0.15

# 每个空载/持件窗口的不同时间戳有效力帧数、最长等待时间和静置时间。
WEIGHT_CHECK_SAMPLES=31
WEIGHT_CHECK_TIMEOUT_S=3.0
WEIGHT_CHECK_SETTLE_S=0.3
