# 左臂释放工件后的 7 轴返回位
left_return_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]

[deployment.gzhu.workpiece_2.right_handoff]
# 右臂接取工件前的 7 轴准备位
prepare_joints_deg = [173.9519, 50.8063, -79.5218, 85.0397, -25.3112, 4.5552, 79.6344]
# 右臂进入最终抓取轨迹前的 7 轴预抓位
pregrasp_joints_deg = [173.9519, 50.8063, -79.5218, 85.0397, -25.3112, 4.5552, 79.6344]
# 右臂在交接点夹取工件的 7 轴位姿
grasp_joints_deg = [163.1305, 59.7847, -70.9730, 79.0452, -21.6032, 0.3420, 79.2925]
# 右臂交接成功后、进入 Module 9 前的广大专用 7 轴放置准备位
place_ready_joints_deg = [102.2483, 21.8477, -87.2013, 83.4439, -147.2882, -32.2943, -66.0196]
# 左爪释放后，左臂沿 body_base -X 方向的避让距离
post_release_clearance_minus_x_m = 0.03
# 左爪释放后，左臂沿 body_base +Z 方向的抬升距离
post_release_clearance_plus_z_m = 0.03

