# 两个部署现场、两类工件的左臂反抓与右臂交接参数。
# 关节角单位为 deg；空间距离按参数名分别使用 m 或 mm；时间单位为 s。
# 所有反抓预备位、左侧交接位、右侧交接/放置准备位必须显式归属
# deployment.xiangxin 或 deployment.gzhu，不再使用无地区基线。四套组合为
# deployment.<mode>.workpiece_<1|2>，这是运动位置参数的唯一来源。
# 总控会将 --mode（默认 gzhu）写入 PARM_DEPLOYMENT_MODE，加载器据此只读取对应现场。
# 修改后需重启对应模块/总控，运行中的进程不会自动重读本文件。

# ============================== 广大现场 ==============================

[deployment.gzhu.left_observation]
# 头部云台俯仰观察角
head_pitch_deg = 2.0
# 头部云台偏航观察角
head_yaw_deg = 26.5
# body/head D435 手眼标定文件
alignment = "tools/calibration/head_d435/gzhu_reverse_observation.json"
# SAM2 自动标点/掩码配置
auto_mask_config = "tools/handoff_observation/gzhu_head_d435_auto_mask_config.json"

[deployment.gzhu.workpiece_1.left_reverse_grasp]
# 左臂反抓前的 7 轴预备位
ready_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]
# 预备位各轴允许的最大到位误差
arrival_tolerance_deg = 0.5
# 等待左臂到达预备位的最长时间
arrival_timeout_s = 90.0
# 反抓闭爪后沿上方抬升的距离，随后读取左夹爪状态判断持件
post_close_lift_m = 0.03
# 反抓失败时允许的最大抓取尝试次数
max_grasp_attempts = 5

[deployment.gzhu.workpiece_1.left_handoff]
# 左臂交接前的 7 轴准备位（239c401 实测集）
prepare_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]
# D435 拍摄交接位姿时的左臂 7 轴观察位（239c401 实测集）
observation_joints_deg = [-14.7040, 36.4990, -75.2620, 92.1380, -91.4400, 50.8820, 88.0000]
# 交接姿态轴向与目标轴向的最大夹角误差
axis_tolerance_deg = 2.0
# body_base 坐标系下的交接目标中心 [x, y, z]（239c401 实测集）
handoff_center_body_m = [0.4200, 0.1000, 0.2500]
# 左夹爪工件中心与交接中心的最大位置误差
center_tolerance_mm = 25.0
# 左臂释放工件后的 7 轴返回位（239c401 实测集）
left_return_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]

[deployment.gzhu.workpiece_1.right_handoff]
# 右臂在交接点夹取工件的 7 轴位姿（239c401 实测集）
grasp_joints_deg = [164.523, 57.0258, -68.7826, 78.3201, -24.2591, 3.8508, 78.1156]
# 右臂交接成功后、进入 Module 9 前的 7 轴放置准备位（239c401 实测集）
place_ready_joints_deg = [30.4353, 23.8637, 0.5905, 66.3409, -62.0439, -64.3304, 25.7149]
# 放置准备位各轴允许的最大到位误差
place_ready_tolerance_deg = 0.5

[deployment.gzhu.workpiece_2.left_reverse_grasp]
# 左臂反抓前的 7 轴预备位
ready_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]
# 预备位各轴允许的最大到位误差
arrival_tolerance_deg = 0.5
