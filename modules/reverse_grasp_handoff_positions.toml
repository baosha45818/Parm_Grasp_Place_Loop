observation_joints_deg = [-14.7040, 36.4990, -75.2620, 92.1380, -91.4400, 50.8820, 88.0000]
# body_base 坐标系下的交接目标中心 [x, y, z]
handoff_center_body_m = [0.4200, 0.1000, 0.2500]
# 交接姿态轴向与目标轴向的最大夹角误差
axis_tolerance_deg = 2.0
# 左夹爪工件中心与交接中心的最大位置误差
