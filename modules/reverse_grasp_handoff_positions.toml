# 反抓失败时允许的最大抓取尝试次数
max_grasp_attempts = 5

[deployment.gzhu.workpiece_2.left_handoff]
# 左臂交接前的 7 轴准备位
prepare_joints_deg = [14.2810, -29.8860, -85.6330, 102.5040, 37.3780, 56.0160, 9.2410]
