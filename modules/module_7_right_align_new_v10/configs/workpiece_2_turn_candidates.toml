# Module 7 工件2预抓取与闭爪后“调整到右手可直接抓取范围”的候选。
#
# 工件2语义坐标系来自 workpiece_2 STL：+Z 是正面法向，原点是 STL 语义中心。
# front_base_rpy_deg 是正面工件的基准姿态，定义在 body_base 下；当前 [0,0,0]
# 即工件 +X/+Y/+Z 分别平行 body_base +X/+Y/+Z。
# 运行时目标为 R_body_object_front @ R_local_xyz(roll,pitch,yaw)，所以 r/p/y
# 都是绕工件自身局部轴旋转，不是相对当前抬起姿态，也不是 body_base 的绝对 RPY。

[turn]
# 本文件只供工件2读取，同时配置预抓取和闭爪后调整候选。
planner = "rrtstar"
front_base_rpy_deg = [0.0, 0.0, 0.0]

# 到达预抓取点时，绕 TCP 自身局部 X/Y/Z 的 R/P/Y 候选（deg）。
# 列表顺序即搜索优先级；组合顺序为对称夹爪方向 -> roll -> pitch -> yaw，
# 因此 yaw 变化最快。总数还要乘以两个对称夹爪方向，轴夹角过滤前共 686 个。
pregrasp_roll_candidates_deg = [0.0, 2.0, -2.0, 4.0, -4.0, 6.0, -6.0]
pregrasp_pitch_candidates_deg = [0.0, 2.0, -2.0, 4.0, -4.0, 6.0, -6.0]
pregrasp_yaw_candidates_deg = [0.0, 2.0, -2.0, 4.0, -4.0, 6.0, -6.0]

# 闭爪、上抬结束后，以“当时的工件中心”为原点的 body_base 平移候选（m）。
# 优先级从列表前到后。组合外到内严格为 x -> y -> z -> roll -> pitch -> yaw，
# 所以 yaw 变化最快，x 变化最慢。第一个候选总是六个列表的第一个值组合；
# 总候选数 = len(x) × len(y) × len(z) × len(roll) × len(pitch) × len(yaw)。
# 当前总候选数 = 2 × 3 × 1 × 3 × 5 × 6 = 540。
x_offset_candidates_m = [0.0, 0.1]
y_offset_candidates_m = [-0.3, -0.2, -0.1]
z_offset_candidates_m = [0.0]

# 工件自身局部 R/P/Y 候选（deg），优先级从左到右。

yaw_candidates_deg = [45.0, 60.0, 30,0, 75.0, 15.0]
roll_candidates_deg = [10.0, 20.0, 30.0]
pitch_candidates_deg = [0.0, -10.0, 10.0, -20.0, 20.0]
